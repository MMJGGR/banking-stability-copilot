name: Phase 2 measurement and transition checkpoint
# Final consolidated checkpoint. Reuses validated lower-rank evidence and fits only unresolved higher ranks.
on:
  push:
    branches: [research/broad-feature-phase2-transition-2026-09-22]
    paths: [.github/workflows/forecasting-phase2-complete.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: forecasting-phase2-complete
  cancel-in-progress: false

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1' \
            'scikit-learn==1.5.2' 'pyarrow==19.0.1' \
            'pytest==8.3.5' 'threadpoolctl==3.6.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip check

      - name: Verify Phase 2 code and target firewall
        run: |
          set -o pipefail
          mkdir -p phase2-evidence
          python -m compileall -q src/forecasting tests/test_forecasting_phase2*.py
          python -m pytest \
            tests/test_forecasting_phase2_measurement.py \
            tests/test_forecasting_phase2_execution.py \
            tests/test_forecasting_phase2_transition.py \
            tests/test_forecasting_phase2_uncertainty.py \
            -q --junitxml=phase2-evidence/tests.xml | tee phase2-evidence/tests.txt
          ! grep -R -q 'target-pairs.csv' \
            src/forecasting/phase2_measurement.py \
            src/forecasting/phase2_measurement_execution.py \
            src/forecasting/phase2_full_execution.py \
            src/forecasting/phase2_resolved_execution.py \
            src/forecasting/phase2_transition.py \
            src/forecasting/phase2_uncertainty.py

      - name: Retrieve immutable data and prior rank-boundary evidence
        run: |
          set -euo pipefail
          gh api repos/MMJGGR/banking-stability-copilot/actions/artifacts/10463106988/zip > /tmp/m2.zip
          echo 'f670f2e7caff532201c1a198130d0f8b34cb04784cb643dae2c5466af9359c9b  /tmp/m2.zip' | sha256sum -c -
          gh api repos/MMJGGR/banking-stability-copilot/actions/artifacts/10701178100/zip > /tmp/prior.zip
          echo 'a1df1c17c326b889453918a71ba9c4a072c295e0c9c4c5ad37bff22e5a610ae7  /tmp/prior.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          for archive_name, root_name in [('m2','/tmp/m2'),('prior','/tmp/prior')]:
              root=Path(root_name)
              with zipfile.ZipFile(f'/tmp/{archive_name}.zip') as archive:
                  for member in archive.infolist():
                      destination=(root/member.filename).resolve()
                      assert destination.is_relative_to(root.resolve())
                      assert (member.external_attr >> 16) & 0o170000 != 0o120000
                  archive.extractall(root)
          matches=list(Path('/tmp/prior').rglob('phase2a-selection.json'))
          assert len(matches)==1, matches
          prior_results=matches[0].parent
          Path('/tmp/prior-results-path.txt').write_text(str(prior_results))
          PY

      - name: Execute resolved Phase 2 research checkpoint
        run: |
          set -o pipefail
          PRIOR_RESULTS="$(cat /tmp/prior-results-path.txt)"
          python -m src.forecasting.phase2_resolved_execution \
            --snapshot /tmp/m2/live \
            --prior-results "$PRIOR_RESULTS" \
            --output phase2-evidence/results \
            --max-selection-cells 1200000 \
            --extension-epochs 5 \
            --mode-epochs 4 \
            --final-epochs 6 \
            2>&1 | tee phase2-evidence/execution.log

      - name: Verify Phase 2 completion and production isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('phase2-evidence/results/phase2-summary.json').read_text())
          assert report['status']=='completed_phase2_measurement_and_transition_development', report['status']
          assert not report['production_modified']
          assert not report['crisis_classifier_retrained']
          assert report['phase2a']['targets_read']==0
          assert report['phase2a']['crisis_labels_read']==0
          assert report['phase2a']['production_scores_read']==0
          assert report['phase2b']['supervised_banking_targets_read']==0
          assert report['phase2b']['crisis_labels_read']==0
          print(json.dumps({
              'status':report['status'],
              'state_rank':report['phase2a']['state_rank'],
              'measurement_mode':report['phase2a']['measurement_mode'],
              'phase2a_gates':report['phase2a']['gates'],
              'coverage_geometry':report['phase2a']['coverage_geometry'],
              'uncertainty_masking':report['phase2a']['uncertainty_masking'],
              'transition_winners':report['phase2b']['winners'],
              'next_phase':report['next_phase'],
          },indent=2))
          PY
          git diff --exit-code 5957ca779dafa21f2e098c819bfb060f43243206 -- \
            app.py train_model.py cache artifacts data \
            src/pillar_pipeline.py src/feature_engineering.py \
            src/crisis_classifier.py src/crisis_panel.py src/crisis_hazard.py

      - name: Preserve compact Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-measurement-transition-${{ github.run_id }}
          path: |
            phase2-evidence/
            docs/prd/broad-feature-phase2-v0.6.md
            docs/research/forecasting-implementation.md
          retention-days: 45
          compression-level: 6
          if-no-files-found: error
