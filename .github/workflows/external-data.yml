name: Fetch external-liquidity source data

# Backlog ranks 5-14: BOP, IIP, IRFCL, CPIS, CDIS, Fiscal Monitor, GFS, QEDS.
# Runs on GitHub Actions because api.imf.org is reachable here (verified for
# the WEO/FSIC/MFS/FSIBSIS refresh) but blocked in some development
# environments. The production path is bounded and feature-oriented: it queries
# exact BOP/IIP keys for model-country ISO3 batches, builds staged
# external-liquidity features, and uploads candidate caches for review. Caches
# are NEVER committed automatically, consistent with refresh-data.yml and
# docs/GOVERNANCE.md.

on:
  schedule:
    - cron: "43 5 5 * *"
  workflow_dispatch:
    inputs:
      start_period:
        description: Earliest period to keep (year, YYYY-Qn, or YYYY-Mnn)
        required: false
        default: "2018"

permissions:
  contents: read

jobs:
  fetch-external:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source only
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install serving dependencies (sufficient for retrieval)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Discover dataflow IDs and key structures
        run: python -m src.scripts.discover_external_sources

      - name: Build bounded external-liquidity feature inputs
        shell: bash
        run: |
          python -m src.scripts.build_external_liquidity_features \
            --fetch \
            --start-period "${{ inputs.start_period || '2018' }}" \
            --batch-size 25

      - name: Build staged government-liquidity features (from WEO cache)
        shell: bash
        # No external API calls: the general-government WEO series are resolved
        # from the public LFS media endpoint, so this runs in an lfs:false
        # checkout. Staged challenger inputs, never production-scored.
        run: python -m src.scripts.build_government_liquidity_features

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## External-liquidity source run"
            echo '```json'
            cat config/external_sources_discovery.json 2>/dev/null || echo "no discovery output"
            echo '```'
            echo '```json'
            cat artifacts/external_liquidity_features_report.json 2>/dev/null || echo "no feature report"
            echo '```'
            echo "## Government-liquidity source run"
            echo '```json'
            cat artifacts/government_liquidity_features_report.json 2>/dev/null || echo "no feature report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate caches and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-liquidity-data
          if-no-files-found: error
          retention-days: 30
          path: |
            config/external_sources_discovery.json
            artifacts/external_liquidity_features_report.json
            artifacts/government_liquidity_features_report.json
            cache/external/*.parquet
            cache/government/*.parquet
