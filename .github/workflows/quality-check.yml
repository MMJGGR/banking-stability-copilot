name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source without unrelated large artifacts
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Hydrate this checkout's committed serving artifacts
        # The app's emergency HTTP fallback targets production. PR tests must
        # instead use the exact LFS objects referenced by their own merge tree.
        # Keep checksum checks intact; never replace the PR manifest with master.
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="cache/risk_model.pkl,cache/inference_pipeline.pkl,cache/crisis_classifier.pkl,cache/crisis_features.parquet,cache/imputed_features.parquet,cache/FSIC_cache.parquet,cache/FSIBSIS_cache.parquet,cache/MFS_cache.parquet,cache/WEO_cache.parquet,cache/WGI_cache.parquet,data/reference/government_liquidity*.parquet" --exclude=""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-dev.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app.py train_model.py src tests

      - name: Verify the complete serving bundle before app tests
        run: python -m src.scripts.smoke_test_artifacts

      - name: Run tests
        run: python -m pytest -q
