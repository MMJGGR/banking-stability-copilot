name: Inspect forecasting source schemas
on:
  push:
    branches: [research/broad-feature-forecasting-2026-09-16]
    paths: [.github/workflows/forecasting-source-schema.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas==2.2.3' 'pyarrow==19.0.1'
      - name: Read exact committed source caches
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="cache/FSIC_cache.parquet,cache/FSIBSIS_cache.parquet,cache/MFS_cache.parquet,cache/WEO_cache.parquet,cache/WGI_cache.parquet" --exclude=""
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          manifest=json.loads(Path('artifacts/data_manifest.json').read_text())
          report={}
          for source in ['FSIC','FSIBSIS','MFS','WEO','WGI']:
              path=Path('cache')/f'{source}_cache.parquet'
              meta=manifest['artifacts'][str(path)]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==meta['sha256']
              df=pd.read_parquet(path)
              report[source]={'rows':len(df),'columns':df.columns.tolist(),'dtypes':df.dtypes.astype(str).to_dict(),'sample':json.loads(df.head(2).to_json(orient='records',date_format='iso'))}
              print(source,json.dumps(report[source],default=str))
          root=Path('research-output');root.mkdir()
          (root/'source-schemas.json').write_text(json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forecasting-source-schemas-2026-09-16
          path: research-output/source-schemas.json
          retention-days: 30
