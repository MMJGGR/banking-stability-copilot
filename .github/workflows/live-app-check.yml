name: Verify live Streamlit reachability

on:
  push:
    branches:
      - master
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      app_url:
        description: Optional Streamlit URL override
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: live-streamlit-reachability
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_URL: ${{ github.event.inputs.app_url || vars.STREAMLIT_APP_URL || 'https://bankenv.streamlit.app' }}
      INITIAL_DELAY: ${{ github.event_name == 'push' && '60' || '0' }}

    steps:
      - name: Check out probe code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe public or access-controlled app surface
        id: probe
        shell: bash
        run: >-
          python -m src.scripts.check_live_streamlit
          --url "$APP_URL"
          --initial-delay "$INITIAL_DELAY"
          --attempts 6
          --interval-seconds 30
          --timeout 15
          --output artifacts/live_app_check.json

      - name: Upload reachability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-streamlit-reachability-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/live_app_check.json
