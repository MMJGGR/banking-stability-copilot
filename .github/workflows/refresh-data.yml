name: Build candidate data snapshot

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Snapshot cutoff in YYYY-MM-DD format
        required: true
        default: "2025-12-31"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source only
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run unit tests
        run: python -m pytest -q

      - name: Fetch sources and build candidate snapshot
        env:
          WEO_API_EXPORT_URL: ${{ secrets.WEO_API_EXPORT_URL }}
          WEO_BULK_DOWNLOAD_URL: ${{ secrets.WEO_BULK_DOWNLOAD_URL }}
          FSIC_API_EXPORT_URL: ${{ secrets.FSIC_API_EXPORT_URL }}
          FSIC_BULK_DOWNLOAD_URL: ${{ secrets.FSIC_BULK_DOWNLOAD_URL }}
          MFS_API_EXPORT_URL: ${{ secrets.MFS_API_EXPORT_URL }}
          MFS_BULK_DOWNLOAD_URL: ${{ secrets.MFS_BULK_DOWNLOAD_URL }}
          FSIBSIS_API_EXPORT_URL: ${{ secrets.FSIBSIS_API_EXPORT_URL }}
          FSIBSIS_BULK_DOWNLOAD_URL: ${{ secrets.FSIBSIS_BULK_DOWNLOAD_URL }}
          WGI_API_EXPORT_URL: ${{ secrets.WGI_API_EXPORT_URL }}
          WGI_BULK_DOWNLOAD_URL: ${{ secrets.WGI_BULK_DOWNLOAD_URL }}
        run: >-
          python -m src.scripts.refresh_data
          --as-of "${{ inputs.as_of_date }}"

      - name: Upload candidate serving artifacts
        uses: actions/upload-artifact@v4
        with:
          name: banking-copilot-${{ inputs.as_of_date }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/data_manifest.json
            cache/*_cache.parquet
            cache/crisis_features.parquet
            cache/imputed_features.parquet
            cache/risk_model.pkl
            cache/crisis_classifier.pkl
