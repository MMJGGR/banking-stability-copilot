name: Build candidate data snapshot

on:
  schedule:
    - cron: "17 7 12 * *"
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Snapshot cutoff in YYYY-MM-DD format
        required: true
        default: "2026-06-30"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source only
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run unit tests
        run: python -m pytest -q

      - name: Resolve snapshot cutoff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SNAPSHOT_DATE="${{ inputs.as_of_date }}"
          else
            SNAPSHOT_DATE="$(date -u +%Y-%m-%d)"
          fi
          echo "SNAPSHOT_DATE=${SNAPSHOT_DATE}" >> "$GITHUB_ENV"
          echo "Snapshot cutoff: ${SNAPSHOT_DATE}"

      - name: Fetch sources and build candidate snapshot
        run: >-
          python -m src.scripts.refresh_data
          --as-of "$SNAPSHOT_DATE"

      - name: Verify government-liquidity reference bundle
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            artifacts/government_liquidity_features_report.json \
            data/reference/government_liquidity_features.parquet \
            data/reference/government_liquidity_observations.parquet \
            data/reference/government_liquidity_features_report.json
          do
            test -s "$path" || {
              echo "Required government-liquidity output is missing or empty: $path" >&2
              exit 1
            }
          done

      - name: Smoke-test candidate serving artifacts
        run: python -m src.scripts.smoke_test_artifacts

      - name: Upload candidate serving artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-copilot-${{ env.SNAPSHOT_DATE }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/data_manifest.json
            artifacts/model_policy_audit.json
            artifacts/feature_heuristics.json
            artifacts/government_liquidity_features_report.json
            data/reference/government_liquidity_features.parquet
            data/reference/government_liquidity_observations.parquet
            data/reference/government_liquidity_features_report.json
            cache/FSIBSIS_cache.parquet
            cache/FSIC_cache.parquet
            cache/MFS_cache.parquet
            cache/WEO_cache.parquet
            cache/WGI_cache.parquet
            cache/crisis_features.parquet
            cache/imputed_features.parquet
            cache/risk_model.pkl
            cache/inference_pipeline.pkl
            cache/crisis_classifier.pkl
