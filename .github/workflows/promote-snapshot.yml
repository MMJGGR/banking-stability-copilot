name: Promote candidate snapshot

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run ID of the candidate build to promote
        required: true
      snapshot_date:
        description: Snapshot cutoff being promoted (YYYY-MM-DD)
        required: true
  push:
    branches:
      - "refresh/**"
    paths:
      - ".github/workflows/promote-snapshot.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPSHOT_DATE: ${{ inputs.snapshot_date || '2026-11-21' }}
      RUN_ID: ${{ inputs.run_id || '44866605575' }}

    steps:
      - name: Check out source with LFS support
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: banking-copilot-${{ env.SNAPSHOT_DATE }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate

      - name: Install candidate artifacts into working tree
        shell: bash
        run: |
          set -euo pipefail
          install_required() {
            local source="$1"; local target="$2"
            if [ ! -s "$source" ]; then echo "Missing candidate artifact: $source" >&2; exit 1; fi
            install -D -m 0644 "$source" "$target"
          }
          for filename in FSIBSIS_cache.parquet FSIC_cache.parquet MFS_cache.parquet WEO_cache.parquet WGI_cache.parquet crisis_features.parquet imputed_features.parquet risk_model.pkl inference_pipeline.pkl crisis_classifier.pkl; do
            install_required "candidate/cache/$filename" "cache/$filename"
          done
          install_required candidate/artifacts/data_manifest.json artifacts/data_manifest.json
          install_required candidate/artifacts/model_policy_audit.json artifacts/model_policy_audit.json
          install_required candidate/artifacts/government_liquidity_features_report.json artifacts/government_liquidity_features_report.json
          install_required candidate/data/reference/government_liquidity_features.parquet data/reference/government_liquidity_features.parquet
          install_required candidate/data/reference/government_liquidity_observations.parquet data/reference/government_liquidity_observations.parquet
          install_required candidate/data/reference/government_liquidity_features_report.json data/reference/government_liquidity_features_report.json
          if [ -s candidate/artifacts/feature_heuristics.json ]; then install -D -m 0644 candidate/artifacts/feature_heuristics.json artifacts/feature_heuristics.json; fi

      - name: Smoke-test candidate artifacts
        run: python -m src.scripts.smoke_test_artifacts

      - name: Open promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git lfs install --local
          BRANCH="promote/$SNAPSHOT_DATE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master --depth=1
          git checkout -B "$BRANCH" origin/master
          git add -- cache/FSIBSIS_cache.parquet cache/FSIC_cache.parquet cache/MFS_cache.parquet cache/WEO_cache.parquet cache/WGI_cache.parquet cache/crisis_features.parquet cache/imputed_features.parquet cache/risk_model.pkl cache/inference_pipeline.pkl cache/crisis_classifier.pkl artifacts/data_manifest.json artifacts/model_policy_audit.json artifacts/government_liquidity_features_report.json data/reference/government_liquidity_features.parquet data/reference/government_liquidity_observations.parquet data/reference/government_liquidity_features_report.json
          if [ -s artifacts/feature_heuristics.json ]; then git add -- artifacts/feature_heuristics.json; fi
          if git diff --cached --quiet; then echo "Candidate identical to serving tree; no PR needed."; exit 0; fi
          git commit -m "promote snapshot $SNAPSHOT_DATE serving artifacts"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --title "Promote snapshot $SNAPSHOT_DATE" --base master --head "$BRANCH" --body "Official IMF/World Bank refresh through 2026-11-21. Keyed diff vs Nov 12: FSIC +1,709 and 667 revisions; MFS +6,514 and 4,559 revisions; FSIBSIS +1,336 and 129 revisions; no removals; WEO and WGI unchanged. For 201 scored countries, 7 scores moved by 0.1, none changed category, rank correlation 0.99996. Classifier checksum preserved. Unit tests, three model checks, and serving-artifact smoke tests passed. Please review the manifest, model-policy audit, and score changes before merging; merging redeploys the app." || echo "PR already exists for $BRANCH"
