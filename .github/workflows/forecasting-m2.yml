name: Execute broad-feature M2 data contracts
on:
  push:
    branches: [research/broad-feature-forecasting-2026-09-16]
    paths: [.github/workflows/forecasting-m2.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: forecasting-m2-research
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install isolated research dependencies
        run: |
          python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'pyarrow==19.0.1' 'pytest==8.3.5' requests
          python -m pip check
      - name: Verify PRD amendment predates M2 runtime
        run: |
          git merge-base --is-ancestor 9b8d14d14f8480230b3d1f9aeedae1a014356ae1 HEAD
          test -f docs/prd/broad-feature-data-contract-v0.2.md
          mkdir research-evidence
          cp docs/prd/broad-feature*.md research-evidence/
          python -m compileall -q src/forecasting src/scripts/build_forecasting_research_panel.py tests/test_forecasting*.py
      - name: Run all research contract tests including territory recovery
        run: |
          set -o pipefail
          python -m pytest tests/test_forecasting*.py -q --junitxml=research-evidence/tests.xml | tee research-evidence/tests.txt
      - name: Hydrate verified comparison inputs only
        run: |
          git lfs install --local
          git lfs pull --include="cache/FSIC_cache.parquet,cache/FSIBSIS_cache.parquet,cache/MFS_cache.parquet,cache/WEO_cache.parquet,cache/WGI_cache.parquet,cache/crisis_features.parquet" --exclude=""
      - name: Verify and safely extract the complete prior source-retrieval artifact
        run: |
          set -euo pipefail
          gh api repos/MMJGGR/banking-stability-copilot/actions/artifacts/10461733710/zip > /tmp/previous-m2.zip
          echo '6c8122d3fff4d9a0468b9bb76229720916c29cf1e90cdffbd92994062625c30d  /tmp/previous-m2.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root=Path('/tmp/previous-m2')
          with zipfile.ZipFile('/tmp/previous-m2.zip') as z:
              for member in z.infolist():
                  assert (root/member.filename).resolve().is_relative_to(root.resolve())
                  assert (member.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall(root)
          PY
      - name: Recover WGI identities and finish the fixed-vintage broad panel
        run: |
          set -o pipefail
          python -m src.forecasting.resume_m2 --previous /tmp/previous-m2/live --output research-evidence/live 2>&1 | tee research-evidence/execution.log
          git diff --exit-code -- app.py train_model.py cache artifacts data src/pillar_pipeline.py src/feature_engineering.py src/crisis_classifier.py src/crisis_panel.py src/crisis_hazard.py
      - name: Record exact code and successful execution boundaries
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          report=json.loads(Path('research-evidence/live/run.json').read_text())
          assert report['status']=='completed_M2_data_execution_not_model_validation'
          assert report['inputs_unchanged'] and not report['model_training_performed']
          assert len(report['sources'])==5
          paths=['src/forecasting/canonical.py','src/forecasting/panel.py','src/forecasting/wgi.py','src/forecasting/resume_m2.py','src/scripts/build_forecasting_research_panel.py','tests/test_forecasting_canonical.py','tests/test_forecasting_wgi.py','docs/prd/broad-feature-data-contract-v0.2.md']
          out={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},'production_paths_unchanged':True,'prd_amendment_commit':'9b8d14d14f8480230b3d1f9aeedae1a014356ae1'}
          Path('research-evidence/code-verification.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Preserve research evidence, including incomplete runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecasting-m2-data-${{ github.run_id }}
          path: research-evidence/
          compression-level: 4
          retention-days: 90
          if-no-files-found: error
