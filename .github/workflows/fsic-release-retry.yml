name: Final FSIC release gates
on:
  push:
    branches: [fix/fsic-selection-promotion-2026-09-15]
    paths: [.github/workflows/fsic-release-retry.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: fsic-selection-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and normalize audit-only date metadata
        run: |
          python -m pip install -r requirements-dev.txt -c constraints-dev.txt
          python -m pip check
          python review/2026-09-15/finalize_release.py patch
          python - <<'PY'
          from pathlib import Path
          p=Path('src/scripts/validate_fsic_release.py');text=p.read_text()
          old='        saved = sidecar.reindex(eligible.index)[pipe.numeric_columns_]\n'
          new='        saved = sidecar.reindex(eligible.index)[pipe.numeric_columns_].astype(float)\n'
          if old in text:
              assert text.count(old)==1
              p.write_text(text.replace(old,new))
          else:
              assert new in text
          PY
          python -m py_compile src/scripts/validate_fsic_release.py
      - name: Preserve verified production baseline
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="cache/*.pkl,cache/*_cache.parquet,cache/crisis_features.parquet,cache/imputed_features.parquet,data/reference/*.parquet" --exclude=""
          python -c "from src.classifier_integrity import verify_classifier_file; print(verify_classifier_file())"
          mkdir -p /tmp/baseline/cache release-output
          cp cache/*.pkl cache/imputed_features.parquet /tmp/baseline/cache/
      - name: Run complete regression suite and commit audit repair
        run: |
          set -euo pipefail
          python -m pytest -q --junitxml=release-output/tests.xml | tee release-output/tests.txt
          git add src/scripts/validate_fsic_release.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'audit: use numeric arrays when replaying nullable date metadata'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git rev-parse HEAD > release-output/source-commit.txt
      - name: Retrieve and verify original and repaired candidates
        run: |
          set -euo pipefail
          gh api repos/MMJGGR/banking-stability-copilot/actions/artifacts/10402061259/zip > /tmp/previous.zip
          gh api repos/MMJGGR/banking-stability-copilot/actions/artifacts/10404058870/zip > /tmp/repaired.zip
          echo '02c873f47946ffd2d1710d85598a9d53977b4e1b1c798dc3d56552b1e059e683  /tmp/previous.zip' | sha256sum -c -
          echo 'e89dab14c26636aa7cee9a771e26d54e416fd9a2041d3d00ff896f7b1f9eb3dd  /tmp/repaired.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile, json, hashlib, shutil
          from pathlib import Path
          for label in ['previous','repaired']:
              root=Path('/tmp')/label
              with zipfile.ZipFile(f'/tmp/{label}.zip') as z:
                  for name in z.namelist():
                      assert (root/name).resolve().is_relative_to(root.resolve())
                  z.extractall(root)
              manifest=json.loads((root/'artifacts/data_manifest.json').read_text())
              for name,meta in manifest['artifacts'].items():
                  p=root/name
                  assert p.stat().st_size==meta['bytes']
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==meta['sha256']
          for folder in ['cache','artifacts','data']:
              shutil.copytree(Path('/tmp/repaired')/folder,folder,dirs_exist_ok=True)
          PY
          python -m src.scripts.smoke_test_artifacts | tee release-output/smoke.txt
      - name: Full independent replay and source permutation checks
        run: |
          set -o pipefail
          python -m src.scripts.validate_fsic_release --previous /tmp/previous --baseline /tmp/baseline --output release-output 2>&1 | tee release-output/validation.log
      - name: Prepare atomic release only after passing all gates
        run: |
          set -o pipefail
          python review/2026-09-15/finalize_release.py prepare 2>&1 | tee release-output/preparation.log
      - name: Preserve complete gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsic-promotion-validation-2026-09-15
          path: release-output/
          retention-days: 90
          if-no-files-found: error
